<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Recipes Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container py-4">
        <h2 class="mb-3">Recipes Explorer</h2>
        
        <div class="card mb-4">
            <div class="card-header">
                <div class="row g-2">
                    <div class="col-md-3">
                        <input type="text" id="f_title" class="form-control" placeholder="Search title...">
                    </div>
                    <div class="col-md-3">
                        <input type="text" id="f_cuisine" class="form-control" placeholder="Filter cuisine...">
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="f_rating" class="form-control" placeholder="Min rating (>=4.5)">
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="f_cal" class="form-control" placeholder="Max calories (<400)">
                    </div>
                    <div class="col-md-2">
                        <button class="btn btn-primary w-100" onclick="search()">Search</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Recipes List</h5>
                <div class="d-flex align-items-center">
                    <label class="me-2 mb-0">Show:</label>
                    <select class="form-select form-select-sm" id="perPage" onchange="load(1)">
                        <option value="15">15</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Cuisine</th>
                                <th>Rating</th>
                                <th>Total Time</th>
                                <th>Serves</th>
                            </tr>
                        </thead>
                        <tbody id="tbody"></tbody>
                    </table>
                </div>
                
                <div id="noResults" class="text-center text-muted py-4" style="display:none">
                    <i class="fas fa-utensils fa-3x mb-3"></i>
                    <h4>No recipes found</h4>
                    <p>Try adjusting your search criteria</p>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3">
                    <button class="btn btn-outline-secondary" onclick="load(prevPage)">Previous</button>
                    <span id="pageInfo" class="text-muted"></span>
                    <button class="btn btn-outline-secondary" onclick="load(nextPage)">Next</button>
                </div>
            </div>
        </div>

        <div class="offcanvas offcanvas-end" tabindex="-1" id="drawer">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title" id="drawerTitle"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body" id="drawerBody"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
